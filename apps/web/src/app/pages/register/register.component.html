<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md space-y-6">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-primary text-primary-fg grid place-items-center font-bold">L</div>
      <span class="font-display text-xl font-semibold">Ledgerly</span>
    </div>
    <div>
      <h1 class="font-display text-3xl font-semibold">Create your workspace</h1>
      <p class="text-muted mt-2">Start tracking invoices and expenses in minutes.</p>
    </div>
    <form class="card p-6 space-y-4" (ngSubmit)="submit()">
      <div>
        <label class="label" for="name">Full name</label>
        <input id="name" class="field" [(ngModel)]="name" name="name" required />
      </div>
      <div>
        <label class="label" for="email">Email</label>
        <input id="email" class="field" type="email" [(ngModel)]="email" name="email" required />
      </div>
      <div>
        <label class="label" for="company">Company <span class="normal-case opacity-70">(optional)</span></label>
        <input id="company" class="field" [(ngModel)]="company" name="company" />
      </div>
      <div>
        <label class="label" for="password">Password</label>
        <input id="password" class="field" type="password" [(ngModel)]="password" name="password" required minlength="8" />
      </div>
      @if (error()) {
        <p class="text-sm text-danger">{{ error() }}</p>
      }
      <button class="btn-primary w-full" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating…' : 'Create account' }}
      </button>
    </form>
    <p class="text-sm text-muted text-center">
      Already have an account?
      <a routerLink="/login" class="text-primary hover:underline">Sign in</a>
    </p>
  </div>
</div>
