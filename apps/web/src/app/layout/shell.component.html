<div class="min-h-screen flex bg-bg">
  <!-- Desktop sidebar -->
  <aside class="hidden md:flex w-60 shrink-0 flex-col border-r border-border bg-surface">
    <div class="p-5 flex items-center gap-3 border-b border-border">
      <div class="h-9 w-9 rounded-xl bg-primary text-primary-fg grid place-items-center font-bold">L</div>
      <div>
        <div class="font-display font-semibold leading-none">Ledgerly</div>
        <div class="text-[11px] text-muted mt-1">Finance OS</div>
      </div>
    </div>
    <nav class="p-3 flex-1 space-y-1">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-elevated text-fg border-border"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="flex items-center gap-2 rounded-xl border border-transparent px-3 py-2.5 text-sm text-muted hover:text-fg hover:bg-elevated/60 transition"
        >
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="p-4 border-t border-border">
      <div class="text-sm font-medium truncate">{{ auth.user()?.name }}</div>
      <div class="text-xs text-muted truncate">{{ auth.user()?.email }}</div>
      <button class="btn-ghost w-full mt-3 justify-start px-0" type="button" (click)="auth.logout()">Sign out</button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <!-- Mobile top bar -->
    <header class="md:hidden sticky top-0 z-20 flex items-center justify-between gap-3 border-b border-border bg-surface/95 backdrop-blur px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg bg-primary text-primary-fg grid place-items-center text-sm font-bold">L</div>
        <span class="font-display font-semibold">Ledgerly</span>
      </div>
      <button class="btn-secondary py-2 px-3" type="button" (click)="toggle()" aria-label="Menu">Menu</button>
    </header>

    @if (mobileOpen()) {
      <div class="md:hidden fixed inset-0 z-30 bg-black/50" (click)="close()"></div>
      <div class="md:hidden fixed inset-y-0 left-0 z-40 w-64 bg-surface border-r border-border p-4 flex flex-col">
        <nav class="space-y-1 flex-1">
          @for (item of nav; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-elevated text-fg"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="block rounded-xl px-3 py-3 text-sm text-muted"
              (click)="close()"
            >{{ item.label }}</a>
          }
        </nav>
        <button class="btn-ghost justify-start px-0" type="button" (click)="auth.logout()">Sign out</button>
      </div>
    }

    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-6xl w-full mx-auto">
      <router-outlet />
    </main>
  </div>
</div>
